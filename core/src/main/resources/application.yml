# Settings come from environment variables. Hosts, users, passwords and keys
# have no default, so nothing secret is committed and a missing variable fails
# at startup instead of pointing at the wrong place. See README.md.
spring:
  application:
    name: core
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # The schema belongs to database/ (ADR 0012): the service never changes
      # it, and fails at startup when its entities do not match it.
      ddl-auto: validate
    # No database session held open while the response is written.
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    # The outbox relay deletes a message only once the broker confirmed it.
    publisher-confirm-type: simple
    # While the broker is down, the relay gives up within 5 s instead of the
    # default 60 s, so it does not hold a database transaction that long.
    connection-timeout: 5s
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mvc:
    # Errors as RFC 9457 problems, with the API's error code in "code".
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # The router's limit (client_max_body_size), so a ticket PDF it lets
      # through is not refused here; the default is 1 MB.
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          # Public key of the RSA key pair Core signs tokens with (ADR 0005).
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION}

crowded:
  jwt:
    # Private key Core signs tokens with. Only Core gets it.
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
    # Short (ADR 0021): a refresh token continues the session.
    lifetime: 15m
  # Sessions by role (ADR 0021): they end after "idle" without use and "maximum"
  # after sign-in. Backoffice accounts change events and accounts, so theirs are
  # shorter.
  sessions:
    participant:
      idle: 30d
      maximum: 90d
    backoffice:
      idle: 12h
      maximum: 7d
    # Where the browser sees the API: the router removes /api before Core.
    cookie-path: /api
    # Browsers keep Secure cookies only over HTTPS, or on http://localhost.
    cookie-secure: true
  # Per-user limits (ADR 0004); NGINX keeps a coarse per-IP one.
  rate-limits:
    sign-ins-per-email: 10 # per 15 minutes
    sign-ins-per-address: 30 # per 15 minutes
    registrations-per-address: 10 # per hour
    # Enough for the tickets of a family or group and a few retries; each import
    # may call the AI provider, so it also caps its cost.
    ticket-imports-per-user: 20 # per hour
  ai:
    # The AI gives up after 25 seconds, without retries, so an import ends within
    # 30 seconds; the participant then types the event code.
    ticket-extraction-timeout: 25s
    # Groq reads the tickets (ADR 0020). crowded.ai.groq.api-key has no default:
    # without it, every extraction fails and the participant types the event code.
    # A blank key counts as none: the local stack sets one when .env has no key,
    # because Swarm refuses an empty secret.
    groq:
      url: https://api.groq.com/openai/v1
      model: qwen/qwen3.8-27b
  # crowded.tickets.entry-code-key, a Base64 256-bit key, encrypts the entry
  # codes of imported tickets. It has no default: without it, Core refuses ticket
  # imports. See README.md.

server:
  # The router's X-Forwarded-For gives the client's address, which the rate
  # limits use. Tomcat trusts it only from private addresses, such as the Swarm.
  forward-headers-strategy: native

logging:
  structured:
    format:
      # One JSON object per line (Elastic Common Schema) with the traceId of the
      # request or message, which Alloy ships to Loki (ADR 0009).
      console: ecs
  level:
    # The image has none of the PDF base fonts, so PDFBox warns on every ticket that
    # it uses a substitute; that changes nothing for reading the QR code and text.
    org.apache.pdfbox.pdmodel.font: ERROR

management:
  endpoints:
    web:
      exposure:
        # Prometheus scrapes /actuator/prometheus inside the Swarm; the router
        # answers 404 to /actuator from outside.
        include: health, prometheus
  endpoint:
    health:
      # /actuator/health/liveness and /readiness: the container health check
      # calls readiness (ADR 0011).
      probes:
        enabled: true
      # The status of each dependency (database, RabbitMQ, Redis), without
      # details such as host names.
      show-components: always
  tracing:
    sampling:
      # Every request and message gets a trace id. Nothing is exported, so
      # sampling everything costs little.
      probability: 1.0
  metrics:
    distribution:
      # Latency histograms, so Prometheus can compute percentiles.
      percentiles-histogram:
        http.server.requests: true
