# Router: the single entry point of Crowded (API outline, "Router"). It serves
# the routes of routes.conf over HTTPS, with a Let's Encrypt certificate that the
# certbot service keeps (docker-compose.swarm.yml). Port 80 answers Let's
# Encrypt's challenge and sends everything else to HTTPS once the certificate
# exists; before that it serves the routes over HTTP, so a first deployment works
# while the certificate is issued.

# Swarm's DNS. Resolving at request time lets the router start before the
# services it proxies, and follow them when they are replaced.
resolver 127.0.0.11 valid=10s ipv6=off;

# Coarse per-IP limit; per-user limits run in Core (ADR 0004).
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
limit_req_status 429;

# A variable makes nginx read the certificate at each handshake: the router
# starts before the first one exists, and a renewal needs no reload.
map $server_port $tls_certificate {
    default /etc/letsencrypt/live/crowded/fullchain.pem;
}
map $server_port $tls_certificate_key {
    default /etc/letsencrypt/live/crowded/privkey.pem;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    # Let's Encrypt's HTTP-01 challenge, written by certbot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    set $to_https 0;
    if (-f /etc/letsencrypt/live/crowded/fullchain.pem) {
        set $to_https 1;
    }
    # The health check stays on HTTP, inside the Swarm.
    if ($uri ~ ^/(healthz$|\.well-known/acme-challenge/)) {
        set $to_https 0;
    }
    if ($to_https) {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/routes.conf;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    ssl_certificate $tls_certificate;
    ssl_certificate_key $tls_certificate_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tls:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/routes.conf;
}
