# Router: the single entry point of Crowded (API outline, "Router").
# Plain HTTP for now; TLS on 443 comes with the infrastructure story, which owns
# the domain and the certificate.
#
#   /api/notifications/...  -> notifications   (/api is removed)
#   /api/...                -> core            (/api is removed)
#   /backoffice/...         -> backoffice      (/backoffice is removed)
#   /...                    -> participant-app

# Swarm's DNS. Resolving at request time lets the router start before the
# services it proxies, and follow them when they are replaced.
resolver 127.0.0.11 valid=10s ipv6=off;

# Coarse per-IP limit; per-user limits run in Core (ADR 0004).
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    set $core http://core:8080;
    set $notifications http://notifications:8080;
    set $backoffice http://backoffice:8080;
    set $participant_app http://participant-app:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Health and metrics stay inside the Swarm.
    location ~ ^/api/(notifications/)?actuator(/|$) {
        return 404;
    }

    # Server-sent events: no buffering, and connections stay open (ADR 0007).
    # A regex, so /api/notifications itself is proxied: a prefix location
    # ending in "/" answers it with a redirect to /api/notifications/.
    location ~ ^/api/notifications(/|$) {
        limit_req zone=per_ip burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $notifications;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        limit_req zone=per_ip burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $core;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /backoffice {
        return 301 /backoffice/;
    }

    location /backoffice/ {
        rewrite ^/backoffice(/.*)$ $1 break;
        proxy_pass $backoffice;
    }

    location / {
        proxy_pass $participant_app;
    }
}
