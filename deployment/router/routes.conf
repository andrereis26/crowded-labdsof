# The router's routes, shared by the router's HTTPS server (nginx.conf) and the
# local gateway (scripts/local/gateway.nginx.conf). Included inside a server.
#
#   /api/notifications/...  -> notifications   (/api is removed)
#   /api/...                -> core            (/api is removed)
#   /backoffice/...         -> backoffice      (/backoffice is removed)
#   /grafana/...            -> grafana         (ADR 0009; 502 when not deployed)
#   /...                    -> participant-app
#
# Host keeps the port the browser used: Core and Notifications compare it with
# the Origin of a change (ADR 0021).

set $core http://core:8080;
set $notifications http://notifications:8080;
set $backoffice http://backoffice:8080;
set $participant_app http://participant-app:8080;
set $grafana http://grafana:3000;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Health and metrics stay inside the Swarm.
location ~ ^/api/(notifications/)?actuator(/|$) {
    return 404;
}

# Server-sent events: no buffering, and connections stay open (ADR 0007).
# A regex, so /api/notifications itself is proxied: a prefix location
# ending in "/" answers it with a redirect to /api/notifications/.
location ~ ^/api/notifications(/|$) {
    limit_req zone=per_ip burst=40 nodelay;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass $notifications;
    proxy_buffering off;
    proxy_read_timeout 1h;
}

location /api/ {
    limit_req zone=per_ip burst=40 nodelay;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass $core;
    proxy_buffering off;
    proxy_read_timeout 1h;
}

location = /backoffice {
    return 301 /backoffice/;
}

location /backoffice/ {
    rewrite ^/backoffice(/.*)$ $1 break;
    proxy_pass $backoffice;
}

location = /grafana {
    return 301 /grafana/;
}

# Grafana serves itself from /grafana/, so the path is kept. Sign-in is
# Grafana's own; the per-IP limit slows guessing.
location /grafana/ {
    limit_req zone=per_ip burst=40 nodelay;
    proxy_pass $grafana;
}

location / {
    proxy_pass $participant_app;
}
