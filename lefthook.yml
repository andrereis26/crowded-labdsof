# Git hooks for the whole repository, run by Lefthook (https://lefthook.dev).
# Install them once after cloning: lefthook install
# The backend jobs need JAVA_HOME set to a JDK 25.
# See "Contributing" in README.md. Hooks can be skipped with --no-verify; the
# pipeline runs the same checks.

min_version: 2.0.0

pre-commit:
  jobs:
    # Format the staged files of each project and stage the result.
    - name: format core
      root: core/
      glob: "core/**/*.java"
      run: ../scripts/spotless-staged.sh {staged_files}
      stage_fixed: true

    - name: format jobs
      root: jobs/
      glob: "jobs/**/*.java"
      run: ../scripts/spotless-staged.sh {staged_files}
      stage_fixed: true

    - name: format notifications
      root: notifications/
      glob: "notifications/**/*.java"
      run: ../scripts/spotless-staged.sh {staged_files}
      stage_fixed: true

    - name: format backoffice
      root: backoffice/
      glob: "backoffice/**/*.{js,jsx,ts,tsx,mjs,cjs,json,css,html,md,yml,yaml}"
      run: npx --no-install prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    # Git exports GIT_DIR (and GIT_INDEX_FILE) to hooks, and in a linked worktree
    # GIT_DIR points at this repository. Flutter's dart and flutter launchers then
    # read the Crowded commit as their own SDK revision: they rebuild the Flutter
    # tool and report version 0.0.0-unknown, so pub get fails. Clear Git's
    # repository variables for the Flutter commands only.
    - name: format participant-app
      root: participant-app/
      glob: "participant-app/**/*.dart"
      run: unset $(git rev-parse --local-env-vars) && dart format {staged_files}
      stage_fixed: true

    # Runs after formatting, on what will actually be committed.
    - name: gitleaks
      run: scripts/gitleaks.sh git --pre-commit --staged --redact --verbose --no-banner

pre-push:
  jobs:
    # Lint each project changed in the pushed commits.
    - name: lint core
      root: core/
      glob: "core/**"
      run: ./mvnw -B -ntp test-compile

    - name: lint jobs
      root: jobs/
      glob: "jobs/**"
      run: ./mvnw -B -ntp test-compile

    - name: lint notifications
      root: notifications/
      glob: "notifications/**"
      run: ./mvnw -B -ntp test-compile

    - name: lint backoffice
      root: backoffice/
      glob: "backoffice/**"
      run: npm run lint

    - name: lint participant-app
      root: participant-app/
      glob: "participant-app/**"
      # Clears Git's repository variables, as in "format participant-app".
      run: unset $(git rev-parse --local-env-vars) && flutter analyze --fatal-infos

    - name: gitleaks
      run: scripts/gitleaks-pre-push.sh {1}
      use_stdin: true
