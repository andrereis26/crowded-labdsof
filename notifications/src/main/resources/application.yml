# Settings come from environment variables. Hosts, users, passwords and keys
# have no default, so nothing secret is committed and a missing variable fails
# at startup instead of pointing at the wrong place. See README.md.
spring:
  application:
    name: notifications
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # The schema belongs to database/ (ADR 0012): the service never changes
      # it, and fails at startup when its entities do not match it.
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        # A failed message is retried after 5 s, 15 s and 30 s, all within
        # 1 minute, then dead-lettered (Asynchronous Flows, NFR-004). The
        # retries hold a consumer, so a few run side by side.
        concurrency: 2
        max-concurrency: 4
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 5s
          multiplier: 3
          max-interval: 30s
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Public key of the RSA key pair Core signs tokens with (ADR 0005).
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION}

management:
  endpoint:
    health:
      # /actuator/health/liveness and /readiness: the container health check
      # calls readiness (ADR 0011). #70 adds the dependencies' details.
      probes:
        enabled: true
