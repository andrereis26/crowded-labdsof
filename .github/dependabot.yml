# Weekly update PRs. Minor and patch updates are grouped to keep the
# number of PRs low; major updates come one per dependency.
version: 2
updates:
  - package-ecosystem: pub
    directory: /participant-app
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /participant-app
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
