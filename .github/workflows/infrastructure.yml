# CI for the infrastructure (infra/, ADR 0014) on pull requests: formatting,
# validation and Trivy's misconfiguration scan, then a plan against the
# production state, shown in the pull request. Only runs when the
# infrastructure changed. Applying is the Release workflow's job, on main.
# "Infrastructure result" is the required check.
name: Infrastructure

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true

env:
  TOFU_VERSION: 1.13.2

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.infra.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The VM's first boot copies the deployment scripts (infra/main.tf).
      - id: infra
        uses: ./.github/actions/detect-changes
        with:
          paths: ^(infra/|deployment/(remote-deploy\.sh|lib/)|\.github/(workflows/infrastructure\.yml|actions/))

  check:
    name: Format, validate and scan
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu fmt -check -recursive -diff
      # No state here: validation needs the providers only.
      - run: |
          tofu init -backend=false -input=false
          tofu validate
      # Misconfigurations of HIGH or CRITICAL severity fail (ADR 0011).
      - uses: ./.github/actions/trivy-scan
        with:
          type: fs
          target: infra
          report-name: trivy-infrastructure

  plan:
    name: Plan
    needs: [changes, check]
    # Dependabot's runs get no Actions secrets, so they cannot read the state.
    if: needs.changes.outputs.changed == 'true' && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # OIDC sign-in to Azure as the read-only crowded-github-plan identity.
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
      TF_VAR_ssh_allowed_cidrs: ${{ vars.SSH_ALLOWED_CIDRS || '[]' }}
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu init -input=false -backend-config=backend.hcl
      # The plan identity may only read the state, so it does not take the lock.
      - id: plan
        run: |
          set +e
          tofu plan -input=false -lock=false -no-color >"$RUNNER_TEMP/plan.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/plan.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Show the plan in the pull request
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v9
        env:
          PLAN_FILE: ${{ runner.temp }}/plan.txt
          PLAN_STATUS: ${{ steps.plan.outputs.status }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- infrastructure-plan -->';
            let plan = fs.existsSync(process.env.PLAN_FILE) ? fs.readFileSync(process.env.PLAN_FILE, 'utf8') : 'No output.';
            const limit = 60000;
            if (plan.length > limit) plan = '…\n' + plan.slice(-limit);
            const outcome = process.env.PLAN_STATUS === '0' ? 'succeeded' : 'failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n### OpenTofu plan ${outcome}\n\nFor \`${context.sha.slice(0, 7)}\`, [run](${run}). Applied on main by the Release workflow after the merge.\n\n<details><summary>Plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
            await core.summary.addRaw(body).write();

  # The one check the main ruleset requires for the infrastructure: it passes
  # when every job passed or was skipped because nothing changed.
  result:
    name: Infrastructure result
    if: always()
    needs: [changes, check, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success || "$result" == skipped ]] || exit 1
          done
