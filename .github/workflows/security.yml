# Repository-wide security checks: committed secrets (SR-008), known
# vulnerabilities or misconfigurations in dependencies and Dockerfiles, and
# lint of the shell and PowerShell scripts (#111).
# Pull requests, pushes to main (the merged code is checked again, ADR 0011)
# and a weekly run.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays at 06:00 UTC, to catch new vulnerabilities in unchanged code.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0
  PSSCRIPTANALYZER_VERSION: 1.24.0

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan commits for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Pull requests: only their own commits. Pushes to main: the pushed
          # commits. Otherwise (and for a new branch): the whole history.
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="--log-opts=${BASE_SHA}..${HEAD_SHA}"
          elif [ "$EVENT" = "push" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            range="--log-opts=${PUSH_BEFORE}..${GITHUB_SHA}"
          fi
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" "$GITLEAKS_IMAGE" \
            git --redact --verbose --exit-code 1 $range /repo

  dependencies:
    name: Dependency and config scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java
      # Trivy reads the backend's dependencies from the local Maven repository.
      # Without it, it downloads every POM from Maven Central, which answers
      # 429 Too Many Requests and stops the scan.
      - name: Resolve the backend's Maven dependencies
        run: |
          for service in core jobs notifications; do
            (cd "$service" && ./mvnw -B -ntp dependency:go-offline)
          done
      # Lockfiles and Maven dependencies, Dockerfiles and the deployment's
      # configuration. Gate and exceptions: ADR 0011 and .trivyignore.yaml.
      - uses: ./.github/actions/trivy-scan
        with:
          type: fs
          target: .
          report-name: trivy-repository
          args: --skip-dirs participant-app/build --skip-dirs backoffice/node_modules

  scripts:
    name: Script lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Every shell script, including scripts/local/, which also runs on
      # macOS (bash 3.2, BSD tools): see the comment at the top of its lib.sh.
      - name: ShellCheck
        run: |
          git ls-files -z '*.sh' \
            | xargs -0 docker run --rm -v "$GITHUB_WORKSPACE:/mnt" -w /mnt "$SHELLCHECK_IMAGE" -x
      # Every PowerShell script: the Windows twins of the local scripts.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Information, Warning, Error)
          $findings | Format-Table -AutoSize -Wrap RuleName, Severity, ScriptName, Line, Message
          if ($findings.Count -gt 0) { exit 1 }
