# Repository-wide security checks: committed secrets (SR-008) and known
# vulnerabilities or misconfigurations in dependencies and Dockerfiles.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays at 06:00 UTC, to catch new vulnerabilities in unchanged code.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan commits for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Pull requests: only their own commits. Otherwise: the whole history.
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="--log-opts=${BASE_SHA}..${HEAD_SHA}"
          fi
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" "$GITLEAKS_IMAGE" \
            git --redact --verbose --exit-code 1 $range /repo

  dependencies:
    name: Dependency and config scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Scan dependencies and Dockerfiles
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" "$TRIVY_IMAGE" fs \
            --scanners vuln,misconfig \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            --skip-dirs participant-app/build \
            /src
