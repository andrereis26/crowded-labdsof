# CI for the React backoffice, in the order of ADR 0011. Pull requests and
# pushes to main run the checks: Lint first; then unit tests and the build in
# parallel. Pushes to main are also the release: once every check passed, the
# image runs (build, scan, smoke test, push to Docker Hub). "Backoffice
# result" is the required check.
name: Backoffice

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backoffice-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        uses: ./.github/actions/detect-changes
        with:
          paths: ^(backoffice/|scripts/ci/|\.github/(workflows/backoffice\.yml|actions/))

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backoffice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backoffice/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - name: Type check
        run: npx tsc -b

  unit-tests:
    name: Unit tests
    needs: [changes, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backoffice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backoffice/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Vitest fails below 80% line coverage (vite.config.ts).
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backoffice-coverage
          path: backoffice/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    needs: [changes, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backoffice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backoffice/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  image:
    name: Image
    needs: [changes, lint, unit-tests, build]
    # The release: only on main, never in pull requests, and only after the
    # checks of the merged code passed.
    if: github.event_name == 'push' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-image
        with:
          name: crowded-backoffice
          context: backoffice
          smoke-test: scripts/ci/smoke-web.sh "$IMAGE" / /organizacao/eventos
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          dockerhub-namespace: ${{ vars.DOCKERHUB_NAMESPACE }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  result:
    name: Backoffice result
    if: always()
    needs: [changes, lint, unit-tests, build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success || "$result" == skipped ]] || exit 1
          done
