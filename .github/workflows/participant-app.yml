# CI for the Flutter participant app: formatting, static analysis, tests
# with a coverage threshold, web build and container image scan.
name: Participant app

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: participant-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.47.7
  COVERAGE_MIN: 80
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  # Pull requests that do not touch the app skip the other jobs. Skipped
  # jobs count as passed, so they can still be required checks.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD \
              | grep -qE '^(participant-app/|\.github/workflows/participant-app\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  analyze-and-test:
    name: Analyze and test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: participant-app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test --coverage
      - name: Check coverage
        run: |
          awk -F: -v min="$COVERAGE_MIN" '
            /^LF:/ { found += $2 }
            /^LH:/ { hit += $2 }
            END {
              pct = found ? 100 * hit / found : 0
              printf "Line coverage: %.1f%% (%d/%d lines, minimum %d%%)\n", pct, hit, found, min
              if (pct < min) exit 1
            }' coverage/lcov.info
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: participant-app-coverage
          path: participant-app/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  image:
    name: Build and scan image
    needs: [changes, analyze-and-test]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: participant-app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build web
        run: flutter build web --release
      - name: Build image
        run: docker build --tag "crowded/participant-app:${GITHUB_SHA}" .
      - name: Scan image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            "crowded/participant-app:${GITHUB_SHA}"
      - name: Check the container serves the app
        run: |
          docker run --detach --name participant-app --publish 8080:8080 \
            "crowded/participant-app:${GITHUB_SHA}"
          for _ in $(seq 1 10); do
            curl --silent --fail http://localhost:8080/healthz && break
            sleep 1
          done
          curl --silent --fail http://localhost:8080/ | grep -q '<title>'
          curl --silent --fail http://localhost:8080/evento/qualquer | grep -q '<title>'
      - name: Upload web build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: participant-app-web
          path: participant-app/build/web
          retention-days: 14
