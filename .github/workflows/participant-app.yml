# CI for the Flutter participant app (ADR 0011). Pull requests and pushes to
# main run the checks: formatting, static analysis and tests with a coverage
# threshold. Pushes to main are also the release: once the checks passed, the
# image runs (web build, scan, push to Docker Hub). "Participant
# app result" is the required check.
name: Participant app

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: participant-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.47.7
  COVERAGE_MIN: 80

jobs:
  # Pull requests that do not touch the app skip the other jobs. Skipped
  # jobs count as passed in "Participant app result".
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        uses: ./.github/actions/detect-changes
        with:
          paths: ^(participant-app/|scripts/ci/|\.github/(workflows/participant-app\.yml|actions/))

  analyze-and-test:
    name: Analyze and test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: participant-app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test --coverage
      - name: Check coverage
        run: |
          awk -F: -v min="$COVERAGE_MIN" '
            /^LF:/ { found += $2 }
            /^LH:/ { hit += $2 }
            END {
              pct = found ? 100 * hit / found : 0
              printf "Line coverage: %.1f%% (%d/%d lines, minimum %d%%)\n", pct, hit, found, min
              if (pct < min) exit 1
            }' coverage/lcov.info
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: participant-app-coverage
          path: participant-app/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  image:
    name: Image
    needs: [changes, analyze-and-test]
    # The release: only on main, never in pull requests, and only after the
    # checks of the merged code passed.
    if: github.event_name == 'push' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The Dockerfile copies the web build, so it is built first.
      - name: Build web
        working-directory: participant-app
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --release
      - uses: ./.github/actions/build-image
        with:
          name: crowded-participant-app
          context: participant-app
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          dockerhub-namespace: ${{ vars.DOCKERHUB_NAMESPACE }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  result:
    name: Participant app result
    if: always()
    needs: [changes, analyze-and-test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success || "$result" == skipped ]] || exit 1
          done
