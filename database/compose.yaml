# Local development database (ADR 0012): a throwaway PostgreSQL 18 whose data
# lives in memory (tmpfs), migrated and seeded with the demo data on start, and
# empty again once it stops. See README.md.
#   docker compose -f database/compose.yaml up --build --detach
#   docker compose -f database/compose.yaml down
#
# The passwords are for this throwaway database on 127.0.0.1 only;
# production gets its own from Doppler (SR-008).
name: crowded-database

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: crowded
      POSTGRES_USER: crowded
      POSTGRES_PASSWORD: crowded
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U crowded -d crowded']
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/crowded
      DB_USERNAME: crowded
      DB_PASSWORD: crowded
      CORE_DB_PASSWORD: core
      JOBS_DB_PASSWORD: jobs
      NOTIFICATIONS_DB_PASSWORD: notifications
      SEED_DEMO_DATA: "true"
    restart: "no"
