# The local gateway of scripts/local/stack-up.sh: the router's routes
# (deployment/router/nginx.conf, mounted as conf.d/default.conf) and the data
# stores, on ports that stack-up publishes on 127.0.0.1 only.
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    # Swarm's DNS, at connection time: the gateway starts before the services.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 5432;
        set $postgres postgres:5432;
        proxy_pass $postgres;
    }

    server {
        listen 5672;
        set $rabbitmq rabbitmq:5672;
        proxy_pass $rabbitmq;
    }

    server {
        listen 6379;
        set $redis redis:6379;
        proxy_pass $redis;
    }
}
