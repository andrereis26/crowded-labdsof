# The local gateway of scripts/local/stack-up.sh: the router's routes
# (deployment/router/routes.conf), over plain HTTP, and the data stores, on ports
# that stack-up publishes on 127.0.0.1 only.
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    # As the router (deployment/router/nginx.conf), without TLS: browsers keep
    # the session's Secure cookies on http://localhost.
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
    limit_req_status 429;

    server {
        listen 8080;
        server_name _;
        server_tokens off;
        client_max_body_size 10m;

        include /etc/nginx/routes.conf;
    }
}

stream {
    # Swarm's DNS, at connection time: the gateway starts before the services.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 5432;
        set $postgres postgres:5432;
        proxy_pass $postgres;
    }

    server {
        listen 5672;
        set $rabbitmq rabbitmq:5672;
        proxy_pass $rabbitmq;
    }

    server {
        listen 6379;
        set $redis redis:6379;
        proxy_pass $redis;
    }
}
